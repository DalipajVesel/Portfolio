<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">
<script src="webgl-debug.js"></script>
<script src="gl-matrix-min.js"></script>

<script id="vShader" type="x-shader/x-vertex">
attribute vec4 aVertexPosition;
attribute vec4 aVertexColor;
uniform mat4 uModelTransform;
uniform mat4 uPerspectiveViewTransform;
varying vec4 vColor;
void main() {
	gl_Position =  uPerspectiveViewTransform * uModelTransform * aVertexPosition;
	vColor = aVertexColor;
}
</script>

<script id="fShader" type="x-shader/x-fragment">
precision mediump float;
varying vec4 vColor;
void main() {
	gl_FragColor = vColor;
}
</script>

<script>
var gl;
var canvas;
var shadersProgram;
var vertexPositionAttributePointer;
var vertexColorAttributePointer;
var modelUniformPointer;
var perspectiveViewUniformPointer;
var vertexBuffer;
var indexBuffer;
var bodyColorBuffer; // αποχρώσεις κόκκινου
var legColorBuffer; // αποχρώσεις κίτρινου
var scalingMatrix = new Float32Array(16);
var translationMatrix = new Float32Array(16);
var finalMatrix = new Float32Array(16);
var perspectiveMatrix = new Float32Array(16);
var viewMatrix = new Float32Array(16);
var pvMatrix = new Float32Array(16);

var viewAngle = 60.0; // γωνία θέασης 
var camPosition = [30.0, 30.0, 30.0]; // θέση κάμερας
var camOrthoDistance = 30.0; // ορθογώνια απόσταση

var requestID = 0;
var totalAngle = 0.0; // γωνία περιστροφής της κάμερας
var totalZ = 10.0; // ύψος κάμερας
var zDirection = 1; // για ανέβα-κατέβα στο ύψος
var stepAngle = 1.5; // βήμα γωνίας
var stepZ = 0.15; // βήμα ύψους


function createGLContext(inCanvas) {
	var outContext = null;
	outContext = inCanvas.getContext("webgl");
		if (!outContext)
			outContext = inCanvas.getContext("experimental-webgl");
		if (!outContext)
			alert("WebGL rendering context creation error.");

	return outContext;
}

function createCompileShader(shaderType, shaderSource) {
	var outShader = gl.createShader(shaderType);
	gl.shaderSource(outShader, shaderSource);
	gl.compileShader(outShader);
	if (!gl.getShaderParameter(outShader, gl.COMPILE_STATUS)) {
		alert( "Shader compilation error. " + gl.getShaderInfoLog(outShader) );
		gl.deleteShader(outShader);
		outShader = null;
	}
	return outShader;
}

function initShaders() {
	var vertexShaderSource = document.getElementById("vShader").textContent;
	var fragmentShaderSource = document.getElementById("fShader").textContent;
	var vertexShader = createCompileShader(gl.VERTEX_SHADER, vertexShaderSource);
	var fragmentShader = createCompileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
	shadersProgram = gl.createProgram();
	gl.attachShader(shadersProgram, vertexShader);
	gl.attachShader(shadersProgram, fragmentShader);
	gl.linkProgram(shadersProgram);
	if (!gl.getProgramParameter(shadersProgram, gl.LINK_STATUS)) {
		alert("Shaders linking error.");
	}
	gl.useProgram(shadersProgram);
	vertexPositionAttributePointer = gl.getAttribLocation(shadersProgram, "aVertexPosition");
	gl.enableVertexAttribArray(vertexPositionAttributePointer);
	vertexColorAttributePointer = gl.getAttribLocation(shadersProgram, "aVertexColor");
	gl.enableVertexAttribArray(vertexColorAttributePointer);
	modelUniformPointer = gl.getUniformLocation(shadersProgram, "uModelTransform");
	perspectiveViewUniformPointer = gl.getUniformLocation(shadersProgram, "uPerspectiveViewTransform");
}

function initBuffers() {
	// Κορυφές κύβου, 24 κορυφές με 4 συντεταγμένες ανά κορυφή
	var cubeVertices = new Float32Array([
		// Όψη A μπροστά y = +0.5
		-0.5,  0.5, -0.5, 1.0,
		 0.5,  0.5, -0.5, 1.0,
		 0.5,  0.5,  0.5, 1.0,
		-0.5,  0.5,  0.5, 1.0,
		// Όψη B πίσω y = -0.5
		 0.5, -0.5, -0.5, 1.0,
		-0.5, -0.5, -0.5, 1.0,
		-0.5, -0.5,  0.5, 1.0,
		 0.5, -0.5,  0.5, 1.0,
		// Όψη C δεξιά x = +0.5
		 0.5,  0.5, -0.5, 1.0,
		 0.5, -0.5, -0.5, 1.0,
		 0.5, -0.5,  0.5, 1.0,
		 0.5,  0.5,  0.5, 1.0,
		// Όψη D αριστερά x = -0.5
		-0.5, -0.5, -0.5, 1.0,
		-0.5,  0.5, -0.5, 1.0,
		-0.5,  0.5,  0.5, 1.0,
		-0.5, -0.5,  0.5, 1.0,
		// Όψη E πάνω z = +0.5
		-0.5,  0.5,  0.5, 1.0,
		 0.5,  0.5,  0.5, 1.0,
		 0.5, -0.5,  0.5, 1.0,
		-0.5, -0.5,  0.5, 1.0,
		// Όψη F κάτω z = -0.5
		-0.5, -0.5, -0.5, 1.0,
		 0.5, -0.5, -0.5, 1.0,
		 0.5,  0.5, -0.5, 1.0,
		-0.5,  0.5, -0.5, 1.0
	]);
	vertexBuffer = gl.createBuffer();
	gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
	gl.bufferData(gl.ARRAY_BUFFER, cubeVertices, gl.STATIC_DRAW);
	vertexBuffer.itemSize = 4;
	vertexBuffer.itemCount = 24;

	// Αποχρώσεις κόκκινου για κορμό, λαιμό, κεφάλι
	var bodyColors = new Float32Array([
		// Όψη A
		0.90, 0.15, 0.10, 1.0,
		0.90, 0.15, 0.10, 1.0,
		0.90, 0.15, 0.10, 1.0,
		0.90, 0.15, 0.10, 1.0,
		// Όψη B
		0.80, 0.13, 0.09, 1.0,
		0.80, 0.13, 0.09, 1.0,
		0.80, 0.13, 0.09, 1.0,
		0.80, 0.13, 0.09, 1.0,
		// Όψη C
		0.70, 0.12, 0.08, 1.0,
		0.70, 0.12, 0.08, 1.0,
		0.70, 0.12, 0.08, 1.0,
		0.70, 0.12, 0.08, 1.0,
		// Όψη D
		0.60, 0.10, 0.07, 1.0,
		0.60, 0.10, 0.07, 1.0,
		0.60, 0.10, 0.07, 1.0,
		0.60, 0.10, 0.07, 1.0,
		// Όψη E
		0.85, 0.14, 0.09, 1.0,
		0.85, 0.14, 0.09, 1.0,
		0.85, 0.14, 0.09, 1.0,
		0.85, 0.14, 0.09, 1.0,
		// Όψη F
		0.75, 0.12, 0.08, 1.0,
		0.75, 0.12, 0.08, 1.0,
		0.75, 0.12, 0.08, 1.0,
		0.75, 0.12, 0.08, 1.0
	]);
	bodyColorBuffer = gl.createBuffer();
	gl.bindBuffer(gl.ARRAY_BUFFER, bodyColorBuffer);
	gl.bufferData(gl.ARRAY_BUFFER, bodyColors, gl.STATIC_DRAW);
	bodyColorBuffer.itemSize = 4;
	bodyColorBuffer.itemCount = 24;

	// Αποχρώσεις κίτρινου για πόδια, πατούσες, ουρά, αυτιά
	var legColors = new Float32Array([
		// Όψη A
		0.95, 0.85, 0.15, 1.0,
		0.95, 0.85, 0.15, 1.0,
		0.95, 0.85, 0.15, 1.0,
		0.95, 0.85, 0.15, 1.0,
		// Όψη B
		0.85, 0.75, 0.13, 1.0,
		0.85, 0.75, 0.13, 1.0,
		0.85, 0.75, 0.13, 1.0,
		0.85, 0.75, 0.13, 1.0,
		// Όψη C
		0.75, 0.65, 0.11, 1.0,
		0.75, 0.65, 0.11, 1.0,
		0.75, 0.65, 0.11, 1.0,
		0.75, 0.65, 0.11, 1.0,
		// Όψη D
		0.65, 0.55, 0.09, 1.0,
		0.65, 0.55, 0.09, 1.0,
		0.65, 0.55, 0.09, 1.0,
		0.65, 0.55, 0.09, 1.0,
		// Όψη E
		0.90, 0.80, 0.14, 1.0,
		0.90, 0.80, 0.14, 1.0,
		0.90, 0.80, 0.14, 1.0,
		0.90, 0.80, 0.14, 1.0,
		// Όψη F
		0.80, 0.70, 0.12, 1.0,
		0.80, 0.70, 0.12, 1.0,
		0.80, 0.70, 0.12, 1.0,
		0.80, 0.70, 0.12, 1.0
	]);
	legColorBuffer = gl.createBuffer();
	gl.bindBuffer(gl.ARRAY_BUFFER, legColorBuffer);
	gl.bufferData(gl.ARRAY_BUFFER, legColors, gl.STATIC_DRAW);
	legColorBuffer.itemSize = 4;
	legColorBuffer.itemCount = 24;

	// Ορισμός τριγώνων για καθε όψη
	var indexMatrix = new Uint16Array([
		 0,  1,  2,   0,  2,  3,   // Όψη A
		 4,  5,  6,   4,  6,  7,   // Όψη B
		 8,  9, 10,   8, 10, 11,   // Όψη C
		12, 13, 14,  12, 14, 15,   // Όψη D
		16, 17, 18,  16, 18, 19,   // Όψη E
		20, 21, 22,  20, 22, 23    // Όψη F
	]);
	indexBuffer = gl.createBuffer();
	gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
	gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexMatrix, gl.STATIC_DRAW);
	indexBuffer.itemCount = 36;
}

// Σχεδιάζει του κυβου
function drawBox(sx, sy, sz, tx, ty, tz, colorBuf) {
	gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
	gl.vertexAttribPointer(vertexColorAttributePointer, colorBuf.itemSize, gl.FLOAT, false, 0, 0);

	glMatrix.mat4.fromScaling(scalingMatrix, [sx, sy, sz]);
	glMatrix.mat4.fromTranslation(translationMatrix, [tx, ty, tz]);
	glMatrix.mat4.multiply(finalMatrix, translationMatrix, scalingMatrix);
	gl.uniformMatrix4fv(modelUniformPointer, false, finalMatrix);
	gl.drawElements(gl.TRIANGLES, indexBuffer.itemCount, gl.UNSIGNED_SHORT, 0);
}

// Διαστασεις για σχεδιασμο του σκύλου
function drawDog() {
	// Πατούσες
	drawBox(3, 5, 2, -4.5, -5.5, 1, legColorBuffer);
	drawBox(3, 5, 2,  4.5, -5.5, 1, legColorBuffer);
	drawBox(3, 5, 2, -4.5,  5.5, 1, legColorBuffer);
	drawBox(3, 5, 2,  4.5,  5.5, 1, legColorBuffer);
	// Πόδια
	drawBox(3, 4, 6, -4.5, -5.5, 5, legColorBuffer);
	drawBox(3, 4, 6,  4.5, -5.5, 5, legColorBuffer);
	drawBox(3, 4, 6, -4.5,  5.5, 5, legColorBuffer);
	drawBox(3, 4, 6,  4.5,  5.5, 5, legColorBuffer);
	// Κορμός
	drawBox(6, 14, 4, 0, 0, 6, bodyColorBuffer);
	// Λαιμός
	drawBox(4, 4, 3, 0, 5, 9.5, bodyColorBuffer);
	// Κεφάλι
	drawBox(6, 8, 4, 0, 7, 13, bodyColorBuffer);
	// Αυτιά
	drawBox(2, 2, 5, -4, 4, 12.5, legColorBuffer);
	drawBox(2, 2, 5,  4, 4, 12.5, legColorBuffer);
	// Ουρά
	drawBox(2, 2, 4, 0, -6, 10, legColorBuffer);
}

function drawScene() {
	// Τοποθέτηση κάμερας 
	glMatrix.mat4.lookAt(viewMatrix, camPosition, [0,0,0], [0,0,1]);

	// Προβολή προοπτικής
	var farPlane = 100 * camOrthoDistance;
	if (farPlane < 9000) farPlane = 9000;
	glMatrix.mat4.perspective(perspectiveMatrix, viewAngle*Math.PI/180.0, 1, 0.0001, farPlane);
	glMatrix.mat4.multiply(pvMatrix, perspectiveMatrix, viewMatrix);
	gl.uniformMatrix4fv(perspectiveViewUniformPointer, false, pvMatrix);

	gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

	// Σχεδίαση σκύλου
	gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
	gl.vertexAttribPointer(vertexPositionAttributePointer, vertexBuffer.itemSize, gl.FLOAT, false, 0, 0);
	gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

	drawDog();
}

function main() {
	minDimension = Math.min(window.innerHeight, window.innerWidth);
	canvas = document.getElementById("sceneCanvas");
	canvas.width = 0.9*minDimension;
	canvas.height = 0.9*minDimension;
	gl = WebGLDebugUtils.makeDebugContext(createGLContext(canvas));
	initShaders();
	initBuffers();
	// Σκούρο μπλε φόντο 
	gl.clearColor(0.0, 0.0, 0.15, 1.0);
	gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
	gl.enable(gl.DEPTH_TEST);
	drawScene();
}

// Επανασχεδίαση της σκηνής με νέα δεδομένα
function redraw() {
	// Διάβασε τη γωνία θέασης
	var txtViewAngle;
	txtViewAngle = document.getElementById("viewAngleTxt").value;
	var numViewAngle = parseFloat(txtViewAngle);
	viewAngle = numViewAngle;

	// Διάβασε την ορθογώνια απόσταση κάμερας
	var txtCamOrthoDistance;
	txtCamOrthoDistance = document.getElementById("camOrthoDistanceTxt").value;
	var numCamOrthoDistance = parseFloat(txtCamOrthoDistance);
	camOrthoDistance = numCamOrthoDistance;

	// Διάβασε ποιο radio είναι επιλεγμένο
	var radios = document.getElementsByName("camPos");
	var sel = null;
	for (var i = 0; i < radios.length; i++)
		if (radios[i].checked) { sel = radios[i].value; break; }

	var D = camOrthoDistance;
	switch(sel) {
		case "LFT": camPosition = [-D,  D,  D]; break;
		case "LFB": camPosition = [-D,  D, -D]; break;
		case "LBT": camPosition = [-D, -D,  D]; break;
		case "LBB": camPosition = [-D, -D, -D]; break;
		case "RFT": camPosition = [ D,  D,  D]; break;
		case "RFB": camPosition = [ D,  D, -D]; break;
		case "RBT": camPosition = [ D, -D,  D]; break;
		case "RBB": camPosition = [ D, -D, -D]; break;
	}

	drawScene();
}

// Ξεκινάει η κίνηση της κάμερας
function startAnimation() {
	if (requestID == 0)
		requestID = window.requestAnimationFrame(animationStep);
}

function animationStep() {
	// Ενημέρωση γωνίας περιστροφής
	totalAngle += stepAngle*Math.PI/180.0;
	if (totalAngle >= 2*Math.PI) totalAngle -= 2*Math.PI;

	// Ανέβα-κατέβα κάμερας
	totalZ += zDirection*stepZ;
	if (totalZ > camOrthoDistance)  { totalZ = camOrthoDistance;  zDirection = -1; }
	if (totalZ < -camOrthoDistance) { totalZ = -camOrthoDistance; zDirection =  1; }

	// Νέα θέση κάμερας
	var r = camOrthoDistance;
	var x = r*Math.cos(totalAngle);
	var y = r*Math.sin(totalAngle);
	camPosition = [x, y, totalZ];

	drawScene();
	requestID = window.requestAnimationFrame(animationStep);
}

function stopAnimation() {
	window.cancelAnimationFrame(requestID);
	requestID = 0;
}
 </script>

 </head>

<body onload="main()">
<canvas id="sceneCanvas"></canvas>
<p>
Γωνία θέασης:
<input type="text" id="viewAngleTxt" value="60" autocomplete="off">
Ορθογώνια απόσταση κάμερας:
<input type="text" id="camOrthoDistanceTxt" value="30" autocomplete="off">
<br><br>
Θέση κάμερας:
<input type="radio" name="camPos" value="LFT"> Left-Front-Top
<input type="radio" name="camPos" value="LFB"> Left-Front-Bottom
<input type="radio" name="camPos" value="LBT"> Left-Back-Top
<input type="radio" name="camPos" value="LBB"> Left-Back-Bottom
<input type="radio" name="camPos" value="RFT" checked> Right-Front-Top
<input type="radio" name="camPos" value="RFB"> Right-Front-Bottom
<input type="radio" name="camPos" value="RBT"> Right-Back-Top
<input type="radio" name="camPos" value="RBB"> Right-Back-Bottom
<br><br>
<button onclick="redraw()">Επανασχεδίαση</button>
<button id="startButton" onclick="startAnimation()">Ξεκίνα!</button>
<button id="stopButton" onclick="stopAnimation()">Σταμάτα!</button>
</p>
</body>
</html>
